<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopee Demo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

header{
    background:#ee4d2d;
    color:white;
    padding:15px;
    text-align:center;
}

.search-box{
    margin-top:10px;
}

.search-box input{
    width:60%;
    padding:10px;
    border:none;
    border-radius:5px;
}

.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.product{
    width:220px;
    border:1px solid #ddd;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.product img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.product-info{
    padding:10px;
}

.price{
    color:red;
    font-weight:bold;
    margin-top:5px;
}

button{
    width:100%;
    padding:10px;
    background:#ee4d2d;
    color:white;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
    <h1>SHOPEE DEMO</h1>

    <div class="search-box">
        <input type="text" placeholder="Tìm kiếm sản phẩm...">
    </div>
</header>

<section class="products">

    <div class="product">
        <img src="https://picsum.photos/220/200?1">
        <div class="product-info">
            <h3>Điện thoại</h3>
            <p class="price">5.990.000₫</p>
            <button>Mua ngay</button>
        </div>
    </div>

    <div class="product">
        <img src="https://picsum.photos/220/200?2">
        <div class="product-info">
            <h3>Laptop</h3>
            <p class="price">15.990.000₫</p>
            <button>Mua ngay</button>
        </div>
    </div>

    <div class="product">
        <img src="https://picsum.photos/220/200?3">
        <div class="product-info">
            <h3>Tai nghe</h3>
            <p class="price">299.000₫</p>
            <button>Mua ngay</button>
        </div>
    </div>

</section>

</body>
</html>
